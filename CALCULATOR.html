<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>My Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif
    }

    :root {
      --cream: #FFF8E8;
      --cream-dark: #F5EBD3;
      --rose: #DFA6A6;
      --rose-light: #EBC3C3;
      --sage: #AFC79A;
      --sage-light: #DCE8C8;
      --black: #292A26;
      --soft: #55564F;
      --white: #FFF;
      --shadow: rgba(65, 66, 61, .16)
    }

    body {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: var(--black);
      background: linear-gradient(135deg, var(--sage-light), var(--cream), #E8DCE8);
    }

    .calculator,
    .history {
      width: 350px;
      padding: 22px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, .7);
      background: rgba(255, 248, 232, .55);
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 45px var(--shadow);
    }

    h1 {
      text-align: center;
      margin-bottom: 16px;
      font-size: 22px
    }

    #display {
      width: 100%;
      height: 75px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid white;
      border-radius: 18px;
      background: rgba(217, 221, 242, .65);
      color: var(--black);
      font-size: 30px;
      text-align: right;
      outline: none
    }

    .row {
      display: flex;
      gap: 9px;
      margin-bottom: 9px
    }

    button {
      flex: 1;
      height: 55px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 16px;
      background: rgba(255, 255, 255, .45);
      color: var(--black);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(65, 66, 61, .1);
      transition: .15s
    }

    button:hover {
      transform: translateY(-2px)
    }

    button:active {
      transform: scale(.95)
    }

    .operator {
      background: var(--rose);
      color: #674747
    }

    .special {
      background: var(--sage);
      color: #46543D
    }

    .row:last-child button {
      background: var(--rose-light);
      color: #674747
    }

    /* HISTORY */

    .history {
      padding: 18px
    }

    .history h2 {
      font-size: 16px;
      margin-bottom: 10px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px
    }

    #historyList {
      max-height: 150px;
      overflow: auto
    }

    .history-item {
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .5);
      color: var(--soft);
      font-size: 14px
    }

    .clear {
      width: 100%;
      height: 35px;
      margin-top: 8px;
      background: var(--rose-light);
      font-size: 13px
    }

    /* FROG */

    .frog-popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(65, 66, 61, .35);
      justify-content: center;
      align-items: center
    }

    .frog {
      width: 280px;
      padding: 24px;
      border-radius: 24px;
      text-align: center;
      background: linear-gradient(145deg, var(--cream), var(--sage));
      box-shadow: 0 25px 55px var(--shadow)
    }

    .frog-face {
      font-size: 55px;
      margin-bottom: 8px
    }

    .frog h3 {
      font-size: 14px;
      margin-bottom: 7px
    }

    .frog p {
      font-size: 12px;
      color: var(--soft)
    }

    .frog button {
      height: 38px;
      margin-top: 12px;
      background: var(--rose);
      color: var(--cream);
      font-size: 13px
    }

    @media(max-width:400px) {

      .calculator,
      .history {
        width: 100%;
        max-width: 350px
      }
    }
  </style>
</head>

<body>

  <div class="calculator">

    <h1>My Calculator</h1>

    <input id="display" disabled>

    <div class="row">
      <button class="special" onclick="clearDisplay()">AC</button>
      <button class="special" onclick="deleteChar()">Del</button>
      <button onclick="add('.')">.</button>
      <button class="operator" onclick="add('/')">/</button>
    </div>

    <div class="row">
      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button class="operator" onclick="add('*')">*</button>
    </div>

    <div class="row">
      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button class="operator" onclick="add('-')">-</button>
    </div>

    <div class="row">
      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button class="operator" onclick="add('+')">+</button>
    </div>

    <div class="row">
      <button onclick="add('00')">00</button>
      <button onclick="add('0')">0</button>
      <button class="operator" onclick="calculate()">=</button>
      <button onclick="sqrt()">√</button>
    </div>

    <div class="row">
      <button onclick="square()">X²</button>
      <button onclick="percent()">%</button>
    </div>

  </div>


  <!-- HISTORY BELOW CALCULATOR -->

  <div class="history">
    <h2>Calculation History</h2>
    <div id="historyList"></div>
    <button class="clear" onclick="clearHistory()">Clear History</button>
  </div>


  <!-- 731 SECRET -->

  <div class="frog-popup" id="frogPopup">
    <div class="frog">
      <div class="frog-face">🐸</div>
      <h3>FROG HUNTER STATUS: ACTIVE</h3>
      <p>Frog status: unfortunately also active.</p>
      <button onclick="closeFrog()">Close</button>
    </div>
  </div>


  <script>

    let display = document.getElementById("display");
    let historyList = document.getElementById("historyList");
    let history = JSON.parse(localStorage.getItem("history")) || [];

    function add(value) {
      display.value += value;

      if (display.value === "731")
        document.getElementById("frogPopup").style.display = "flex";
    }

    function clearDisplay() {display.value = ""}

    function deleteChar() {display.value = display.value.slice(0, -1)}

    function calculate() {
      try {
        let exp = display.value, result = eval(exp);
        display.value = result;
        addHistory(exp, result);
      } catch {display.value = "Error"}
    }

    function sqrt() {
      try {
        let exp = display.value, result = Math.sqrt(eval(exp));
        display.value = result;
        addHistory("√(" + exp + ")", result);
      } catch {display.value = "Error"}
    }

    function square() {
      try {
        let exp = display.value, result = eval(exp) ** 2;
        display.value = result;
        addHistory(exp + "²", result);
      } catch {display.value = "Error"}
    }

    function percent() {
      try {
        let exp = display.value, result = eval(exp) / 100;
        display.value = result;
        addHistory(exp + "%", result);
      } catch {display.value = "Error"}
    }

    function addHistory(exp, result) {
      history.unshift(exp + " = " + result);
      localStorage.setItem("history", JSON.stringify(history));
      showHistory();
    }

    function showHistory() {
      historyList.innerHTML = "";
      history.forEach(item => {
        let div = document.createElement("div");
        div.className = "history-item";
        div.innerText = item;
        historyList.appendChild(div);
      });
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem("history");
      showHistory();
    }

    function closeFrog() {
      document.getElementById("frogPopup").style.display = "none";
    }

    document.addEventListener("keydown", e => {
      if ("0123456789+-*/.".includes(e.key)) add(e.key);
      if (e.key === "Enter") calculate();
      if (e.key === "Backspace") deleteChar();
      if (e.key === "Escape") clearDisplay();
    });

    showHistory();

  </script>

</body>

</html>
